[build]
builder = "railpack"
buildCommand = "npm install --prefix backend && npm run prisma:generate --prefix backend"

[deploy]
preDeployCommand = ["npm run prisma:migrate --prefix backend"]
startCommand = "npm start --prefix backend"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
